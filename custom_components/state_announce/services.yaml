announce:
  fields:
    entities:
      selector:
        entity:
          multiple: true
    selection:
      selector:
        target:
    device_classes:
      selector:
        select:
          options:
            - window
            - door
            - garage_door
            - opening
            - lock
            - motion
            - occupancy
            - presence
            - moisture
            - smoke
            - gas
            - carbon_monoxide
            - problem
            - running
            - plug
            - power
            - connectivity
            - battery
          multiple: true
          custom_value: true
          translation_key: device_class
    domains:
      selector:
        select:
          options:
            - binary_sensor
            - light
            - switch
            - cover
            - lock
            - fan
            - climate
            - media_player
            - person
            - device_tracker
            - input_boolean
            - sensor
          multiple: true
          custom_value: true
          translation_key: domain
    state:
      required: true
      default: "on"
      selector:
        select:
          options:
            - "on"
            - "off"
          custom_value: true
          translation_key: state
    comparison:
      default: equal
      selector:
        select:
          options:
            - equal
            - not_equal
            - above
            - below
          translation_key: comparison
    message_one:
      example: "{names} is on."
      selector:
        text:
    message_many:
      required: true
      example: "{count} on: {names}."
      selector:
        text:
    message_none:
      example: "Nothing is on."
      selector:
        text:
    targets:
      required: true
      selector:
        select:
          options: []
          multiple: true
          custom_value: true
    advanced_options:
      collapsed: true
      fields:
        name_source:
          default: alias
          selector:
            select:
              options:
                - alias
                - name
                - name_without_area
              translation_key: name_source
        tts_engine:
          selector:
            entity:
              domain: tts
        title:
          example: "Status"
          selector:
            text:
        alexa_type:
          default: tts
          selector:
            select:
              options:
                - tts
                - announce
              translation_key: alexa_type
        report_unavailable:
          default: false
          selector:
            boolean:
        message_unavailable:
          example: "Not reachable: {names}."
          selector:
            text:
